[package]
name = "video_tool"
version = "0.2.6"
edition = "2021"
description = "Desktop app for downloading videos (yt-dlp) and converting them (FFmpeg) - Rust/egui port"
license = "MIT"

[[bin]]
name = "video_tool"
path = "src/main.rs"

[dependencies]
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Read-only use: `deflate-flate2` is all the extractor needs. The umbrella
# "deflate" feature would also pull in zopfli, which only matters for writing.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
dirs = "7"
arboard = "3.6"
regex = "1.13"
ureq = { version = "3", features = ["json"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
