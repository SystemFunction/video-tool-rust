[package]
name = "video_tool"
version = "0.1.1"
edition = "2021"
description = "Desktop app for downloading videos (yt-dlp) and converting them (FFmpeg) - Rust/egui port"
license = "MIT"

[[bin]]
name = "video_tool"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
rfd = "0.15"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
arboard = "3"
regex = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
